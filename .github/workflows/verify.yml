name: Verify results

on:
  push:
    branches: [main, research]
  pull_request:
    branches: [main, research]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - run: python3 scripts/check.py --fetch-cache
